## Test Configuration

### Common Test Setup
```yaml
timeout_seconds: 30  # Max wait for transfer completion
polling_interval_ms: 100  # How often to poll for status
ledger_callback_delay_ms: 50  # Simulate network latency
```

### Mock Ledger Modes
- **SUCCESS**: All operations succeed immediately
- **FAIL**: Operations return failure (insufficient funds, invalid account, etc.)
- **TIMEOUT**: Operations timeout (no callback sent)
- **NO_CALLBACK**: Request succeeds but callback is never sent (network partition)
- **CALLBACK_DELAYED**: Callback is sent but after timeout threshold
- **IDEMPOTENCY_MISMATCH**: Idempotency key returns different result on retry

### Assertions by Scenario

#### Scenario 1 (Normal Success)
```python
assert transfer.state == TransferState.SUCCESS
assert len(ledger.debit_calls) == 1
assert len(ledger.credit_calls) == 1
assert len(ledger.reverse_calls) == 0
assert transfer.ledger_debit_txn_id is not None
assert transfer.ledger_credit_txn_id is not None
assert transfer.error_reason is None
assert len(audit_logs) >= 8
```

#### Scenario 2 (Posting Failure)
```python
assert transfer.state == TransferState.FAILED
assert len(ledger.debit_calls) == 1
assert len(ledger.credit_calls) == 0  # Never reached
assert len(ledger.reverse_calls) == 0
assert transfer.error_reason is not None
assert 'insufficient' in transfer.error_reason.lower() or 'failed' in transfer.error_reason.lower()
```

#### Scenario 3 (Network Retry)
```python
assert transfer.state == TransferState.SUCCESS
assert len(ledger.debit_calls) == 1
assert len(ledger.credit_calls) == 1
assert len(ledger.reverse_calls) == 0
# Verify callback eventually received (check audit log for callback step)
callback_log = next(log for log in audit_logs if 'callback' in log['step'])
assert callback_log is not None
```

#### Scenario 4 (Timeout Rollback)
```python
assert transfer.state == TransferState.FAILED
assert len(ledger.debit_calls) == 1
assert len(ledger.credit_calls) == 1
assert len(ledger.reverse_calls) == 1  # Compensation
assert transfer.reverse_txn_id is not None
assert transfer.error_reason is not None
assert 'credit' in transfer.error_reason.lower() or 'failed' in transfer.error_reason.lower()
```

#### Scenario 5 (Audit Reconciliation)
```python
assert len(audit_logs) >= 8
assert all(log['correlation_id'] == expected_correlation_id for log in audit_logs)
assert all('timestamp' in log for log in audit_logs)
assert any(log['step'] == 'transfer_initiated' for log in audit_logs)
assert any(log['step'] == 'ledger_debit_callback' for log in audit_logs)
assert any(log['step'] == 'ledger_credit_callback' for log in audit_logs)
assert not any(contains_sensitive_data(log) for log in audit_logs)
```

